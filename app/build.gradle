/*
 * =============================================================================
 *  app/build.gradle  --  Build script for the `:app` application module
 * =============================================================================
 *
 *  PURPOSE
 *  -------
 *  Describes how the installable APK is produced: which SDK levels it targets,
 *  what identity it ships under, how each build type is optimised, and which
 *  libraries it links against.
 *
 *  KEY CONCEPTS FOR READERS NEW TO ANDROID
 *  ---------------------------------------
 *  compileSdk : the API level the code is COMPILED against. Using the newest
 *               level lets you call the newest APIs; it does not change which
 *               devices can install the app.
 *  minSdk     : the OLDEST Android version that may install the app.
 *  targetSdk  : the version the app was tested against. Android uses it to
 *               decide whether to apply backward-compatibility behaviours.
 *  applicationId : the app's permanent, unique identity on a device and in the
 *               Play Store. Independent of the Java package `namespace`.
 * =============================================================================
 */

plugins {
    alias(libs.plugins.android.application)
}

/*
 * -----------------------------------------------------------------------------
 *  RELEASE SIGNING  --  required for over-the-air updates to work at all
 * -----------------------------------------------------------------------------
 *
 *  THE RULE
 *  Android refuses to update an installed app with an APK signed by a DIFFERENT
 *  key. Every OTA release must therefore be signed with the SAME keystore, for
 *  the entire life of the product.
 *
 *  Lose that keystore and no device in the field can ever be updated again;
 *  each one has to be uninstalled and reinstalled by hand. Back it up somewhere
 *  you would trust with a password manager.
 *
 *  WHY THIS BLOCK IS GUARDED BY A FILE CHECK
 *  Credentials must never be committed. `keystore.properties` is listed in
 *  .gitignore, so:
 *
 *    * On a machine WITHOUT the file (a fresh clone, CI without secrets), the
 *      block is skipped and debug builds work normally.
 *    * On a machine WITH the file, release builds are signed automatically.
 *
 *  No developer has to remember to configure anything, and no secret can leak
 *  into version control.
 *
 *  TO SET IT UP (once, ever):
 *
 *    keytool -genkeypair -v -keystore hcrobotics-release.jks \
 *            -keyalg RSA -keysize 2048 -validity 10000 -alias hcrobotics
 *
 *  then create keystore.properties beside this file:
 *
 *    storeFile=../hcrobotics-release.jks
 *    storePassword=...
 *    keyAlias=hcrobotics
 *    keyPassword=...
 * -----------------------------------------------------------------------------
 */
/*
 *  TWO WAYS TO SUPPLY THE SIGNING KEY
 *  ----------------------------------
 *  1. LOCAL  - keystore.properties beside this file. Gitignored, so a fresh
 *              clone simply has no release key and still builds debug fine.
 *  2. CI     - environment variables fed from GitHub Secrets. The keystore
 *              itself is stored base64-encoded as a secret and written to disk
 *              by the workflow before the build.
 *
 *  Supporting both matters: a developer must be able to build a signed release
 *  locally, and CI must be able to do it with no file checked in anywhere.
 *
 *  THE RULE THAT MAKES OTA POSSIBLE AT ALL
 *  ---------------------------------------
 *  Android refuses to install an update signed by a different key than the
 *  installed build - INSTALL_FAILED_UPDATE_INCOMPATIBLE.
 *
 *  This project hit exactly that: every APK up to 1.6.0 was a DEBUG build
 *  signed with this machine's debug keystore, then 1.7.0 was built by GitHub
 *  Actions, which generated its OWN debug keystore. Different key, refused
 *  install.
 *
 *  Debug keystores are per-machine and auto-generated, so they can never be a
 *  basis for distribution. One fixed release key, used by every build forever,
 *  is the only arrangement that works.
 */
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasReleaseKeystore = false

if (keystorePropertiesFile.exists()) {
    // Local developer machine.
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    hasReleaseKeystore = true
} else if (System.getenv("KEYSTORE_PASSWORD")) {
    // CI. The workflow has already decoded the keystore to KEYSTORE_FILE.
    keystoreProperties['storeFile'] = System.getenv("KEYSTORE_FILE") ?: "release.jks"
    keystoreProperties['storePassword'] = System.getenv("KEYSTORE_PASSWORD")
    keystoreProperties['keyAlias'] = System.getenv("KEY_ALIAS")
    keystoreProperties['keyPassword'] = System.getenv("KEY_PASSWORD")
    hasReleaseKeystore = true
}

android {
    /*
     * `namespace` is the Java/Kotlin package used to generate the R class and
     * BuildConfig. It replaces the old `package` attribute in AndroidManifest.
     */
    namespace 'com.hcrobotics.testapp'

    /*
     * API 35 = Android 15. Compiling against the latest installed platform.
     */
    compileSdk 35

    defaultConfig {
        applicationId "com.hcrobotics.testapp"

        // API 24 = Android 7.0 Nougat. Covers >97% of active devices while
        // still allowing modern APIs without heavy compatibility shims.
        minSdk 24
        targetSdk 35

        // versionCode : monotonically increasing integer used by the Play Store
        //               to decide what constitutes an "update".
        // versionName : human-readable string shown in Settings > Apps.
        versionCode 8
        versionName "1.7.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Restrict packaged translations to the locales we actually ship.
        resourceConfigurations += ["en"]
    }

    signingConfigs {
        /*
         * Declared only when keystore.properties is present, so a clone without
         * the credentials still builds debug variants without failing.
         */
        if (hasReleaseKeystore) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            /*
             * The `.debug` suffix lets a debug build sit SIDE BY SIDE with a
             * release build on the same device - invaluable when comparing
             * behaviour between the two.
             *
             * NOTE: because of this, the installed debug package is
             *       `com.hcrobotics.testapp.debug`, not `com.hcrobotics.testapp`.
             */
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'

            // No code/resource shrinking: keeps stack traces readable and
            // keeps incremental builds fast.
            minifyEnabled false
            debuggable true
        }

        release {
            // R8 removes unused code and renames what remains.
            minifyEnabled true
            // Strips resources no longer referenced after code shrinking.
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'

            /*
             * Signed with the release key when keystore.properties is available.
             * Without it the APK is unsigned and CANNOT be installed as an OTA
             * update on any device. See the signing notes at the top of this file.
             */
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        // Java 17 language level - matches the JDK bundled with Android Studio.
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        /*
         * View Binding generates a type-safe binding class per XML layout
         * (activity_main.xml -> ActivityMainBinding). It eliminates
         * findViewById() casts and the class of NullPointerException caused by
         * referencing a view that does not exist in the current layout variant.
         */
        viewBinding true

        /*
         * Generates the BuildConfig class, which exposes BuildConfig.DEBUG and
         * BuildConfig.VERSION_NAME to application code (used by AppLogger and
         * the splash screen's version label).
         */
        buildConfig true
    }

    /*
     * Emit APKs with descriptive file names, e.g.
     *   HCRobotics-1.0.0-debug.apk
     * instead of the default `app-debug.apk`.
     */
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            // `defaultConfig.versionName` is used rather than `variant.versionName`
            // because the latter already carries the build type's versionNameSuffix
            // (e.g. "1.0.0-debug"), which would repeat the build type in the name.
            output.outputFileName =
                    "HCRobotics-${android.defaultConfig.versionName}-${variant.buildType.name}.apk"
        }
    }

    packaging {
        resources {
            // Duplicate licence/metadata files from transitive dependencies
            // would otherwise fail packaging.
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    // --- Local modules -------------------------------------------------------
    /*
     * Over-the-air update support. Self-contained: adding this one line brings
     * in the permissions, the update Activity, the install-result receiver and
     * the background check schedule via manifest merging. The only application
     * code involved is the single OtaUpdater.initialise() call in
     * HcRoboticsApplication.
     */
    implementation project(':updater')

    // --- UI foundation -------------------------------------------------------
    implementation libs.androidx.appcompat        // AppCompatActivity, DayNight themes
    implementation libs.google.material           // Material 3 components + theme overlays
    implementation libs.androidx.constraintlayout // Flat, performant layout engine

    // --- Local JVM unit tests (src/test) -------------------------------------
    testImplementation libs.junit

    // --- Instrumented tests running on a device (src/androidTest) ------------
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}
