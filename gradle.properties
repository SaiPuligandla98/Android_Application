#
# =============================================================================
#  gradle.properties  --  Build environment tuning (project-wide)
# =============================================================================
#
#  Settings here affect HOW the build runs, not WHAT it produces. They are
#  checked into version control so every developer and CI machine builds under
#  identical conditions. Machine-specific values (SDK path, signing secrets)
#  belong in local.properties, which is NOT committed.
# =============================================================================

# --- JVM tuning for the Gradle daemon ----------------------------------------
# 2 GB heap comfortably covers AGP resource processing and D8 dexing for a
# project of this size. UTF-8 is forced so resource parsing is locale-independent.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# --- Performance -------------------------------------------------------------
# Build independent modules concurrently.
org.gradle.parallel=true
# Skip tasks whose inputs and outputs are unchanged.
org.gradle.caching=true
# Only configure the modules actually needed by the requested tasks.
org.gradle.configureondemand=true

# --- AndroidX ----------------------------------------------------------------
# Required: this project uses AndroidX (the successor to the Support Library).
android.useAndroidX=true

# --- Build output ------------------------------------------------------------
# Generate one APK per build type rather than per ABI/density split.
android.nonTransitiveRClass=true
