#
# =============================================================================
#  gradle.properties  --  Build environment tuning (project-wide)
# =============================================================================
#
#  Settings here affect HOW the build runs, not WHAT it produces. They are
#  checked into version control so every developer and CI machine builds under
#  identical conditions. Machine-specific values (SDK path, signing secrets)
#  belong in local.properties, which is NOT committed.
# =============================================================================

# --- JVM tuning for the Gradle daemon ----------------------------------------
# 2 GB heap comfortably covers AGP resource processing and D8 dexing for a
# project of this size. UTF-8 is forced so resource parsing is locale-independent.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# --- Performance -------------------------------------------------------------
# Build independent modules concurrently.
org.gradle.parallel=true
# Skip tasks whose inputs and outputs are unchanged.
org.gradle.caching=true
# Only configure the modules actually needed by the requested tasks.
org.gradle.configureondemand=true

# --- AndroidX ----------------------------------------------------------------
# Required: this project uses AndroidX (the successor to the Support Library).
android.useAndroidX=true

# --- Resource R class ---------------------------------------------------------
#
# Set to FALSE deliberately, so the application's R class also contains the
# resources of the library modules it depends on.
#
# WHY, GIVEN TRUE IS THE MODERN DEFAULT
# View Binding in the application generates a binding class for EVERY merged
# layout, including those belonging to :performance and :appinsights. Those
# generated classes reference the app's own R:
#
#     View root = inflater.inflate(R.layout.perf_activity_performance, ...)
#
# With a non-transitive R that symbol does not exist in the app's R, and the
# release build fails with "cannot find symbol" in generated code that no one
# wrote and no one can edit.
#
# The cost is a slightly larger R class and marginally slower incremental
# builds. The alternative is losing View Binding for library layouts entirely,
# which is a far worse trade.
#
# Note this does NOT make the fully-qualified references elsewhere wrong:
# `com.hcrobotics.updater.R.string.updater_rollback_title` remains valid and is
# still the clearer way to show that a resource belongs to another module.
android.nonTransitiveRClass=false
